plugins { id 'com.android.application' }

android {
    namespace 'com.lkplay.panelhost'
    compileSdk 35
    defaultConfig {
        applicationId 'com.lkplay.panelhost'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '1.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
}
