name: Build Mega Drive TV APK

on:
  push:
    branches: [megadrive-tv]
    paths:
      - 'payload/**'
      - '.github/workflows/build-megadrive-tv.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BLASTEM_COMMIT: 2230addc4dd74dd094fd264987fd808abba32d0e
  LIBRETRO_COMMON_COMMIT: d9597c359a5ca8399a4e244f816e7e975a92a2aa

jobs:
  build:
    name: Build Android TV APK (ARM32 + ARM64)
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Restore and verify source archive
        run: |
          cat payload/chunk*.b64 > "$RUNNER_TEMP/megadrivetv-source.b64"
          python3 - <<'PY'
          import base64
          import hashlib
          from pathlib import Path

          encoded = Path("${{ runner.temp }}/megadrivetv-source.b64").read_bytes()
          archive = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(archive).hexdigest()
          expected = "d30361c7dbb3c9ca9df50c3ecf1d7a47bde45527febce0e51d069fc4ca5194ec"
          if digest != expected:
              raise SystemExit(f"Source archive checksum mismatch: {digest}")
          Path("${{ runner.temp }}/megadrivetv-source.tar.xz").write_bytes(archive)
          print(f"Verified source archive SHA-256: {digest}")
          PY
          tar -xJf "$RUNNER_TEMP/megadrivetv-source.tar.xz"
          test -f MegaDriveTV/app/src/main/java/com/diniz/megadrivetv/MainActivity.kt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Fetch pinned Libretro header
        working-directory: MegaDriveTV
        run: |
          git clone --quiet https://github.com/libretro/libretro-common.git "$RUNNER_TEMP/libretro-common"
          git -C "$RUNNER_TEMP/libretro-common" checkout "$LIBRETRO_COMMON_COMMIT"
          mkdir -p app/src/main/cpp/include
          cp "$RUNNER_TEMP/libretro-common/include/libretro.h" app/src/main/cpp/include/libretro.h

      - name: Prepare BlastEm source
        run: |
          set -euxo pipefail
          git clone --quiet https://github.com/libretro/blastem.git "$RUNNER_TEMP/blastem"
          git -C "$RUNNER_TEMP/blastem" checkout "$BLASTEM_COMMIT"

      - name: Build BlastEm core (ARM64)
        working-directory: MegaDriveTV
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a
          NDK_LLVM="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          time make -C "$RUNNER_TEMP/blastem" -j2 -f Makefile.libretro \
            platform=android-arm64 ANDROID_NDK_LLVM="$NDK_LLVM" ANDROID_API=26 NOLTO=1
          test -s "$RUNNER_TEMP/blastem/libblastem.so"
          cp "$RUNNER_TEMP/blastem/libblastem.so" app/src/main/jniLibs/arm64-v8a/libblastem.so

      - name: Clean BlastEm objects between ABIs
        run: make -C "$RUNNER_TEMP/blastem" -f Makefile.libretro clean

      - name: Build BlastEm core (ARMv7)
        working-directory: MegaDriveTV
        shell: bash
        run: |
          set -euxo pipefail
          NDK_LLVM="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          time make -C "$RUNNER_TEMP/blastem" -j2 -f Makefile.libretro \
            platform=android-armv7 ANDROID_NDK_LLVM="$NDK_LLVM" ANDROID_API=26 NOLTO=1
          test -s "$RUNNER_TEMP/blastem/libblastem.so"
          cp "$RUNNER_TEMP/blastem/libblastem.so" app/src/main/jniLibs/armeabi-v7a/libblastem.so
          mkdir -p licenses
          cp "$RUNNER_TEMP/blastem/COPYING" licenses/BLASTEM-COPYING.txt

      - name: Build debug APK
        working-directory: MegaDriveTV
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: MegaDriveTV-debug-APK
          path: MegaDriveTV/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        if: success()
        run: |
          echo "## Mega Drive TV APK" >> "$GITHUB_STEP_SUMMARY"
          echo "Build concluído para armeabi-v7a e arm64-v8a." >> "$GITHUB_STEP_SUMMARY"
          echo "Baixe o artefato **MegaDriveTV-debug-APK** na aba Actions." >> "$GITHUB_STEP_SUMMARY"
