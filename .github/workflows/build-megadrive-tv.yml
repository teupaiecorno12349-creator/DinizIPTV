name: Build Mega Drive TV APK

on:
  push:
    branches: [megadrive-tv]
    paths:
      - 'payload/**'
      - '.github/workflows/build-megadrive-tv.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BLASTEM_COMMIT: 2230addc4dd74dd094fd264987fd808abba32d0e
  LIBRETRO_COMMON_COMMIT: d9597c359a5ca8399a4e244f816e7e975a92a2aa

jobs:
  build:
    name: Build Android TV APK (ARM32 + ARM64)
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Restore and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          cat payload/chunk*.b64 > "$RUNNER_TEMP/megadrivetv-source.b64"
          python3 - <<'PY'
          import base64
          import hashlib
          from pathlib import Path

          temp = Path("${{ runner.temp }}")
          encoded = (temp / "megadrivetv-source.b64").read_bytes()
          archive = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(archive).hexdigest()
          expected = "d30361c7dbb3c9ca9df50c3ecf1d7a47bde45527febce0e51d069fc4ca5194ec"
          if digest != expected:
              raise SystemExit(f"Source archive checksum mismatch: {digest}")
          (temp / "megadrivetv-source.tar.xz").write_bytes(archive)
          print(f"Verified source archive SHA-256: {digest}")
          PY
          tar -xJf "$RUNNER_TEMP/megadrivetv-source.tar.xz"
          test -f MegaDriveTV/app/src/main/java/com/diniz/megadrivetv/MainActivity.kt
          # Junrar 8.x renamed FileHeader.getFileNameString() to getFileName().
          game_library="MegaDriveTV/app/src/main/java/com/diniz/megadrivetv/library/GameLibrary.kt"
          grep -q 'fileNameString' "$game_library"
          sed -i 's/fileNameString/fileName/g' "$game_library"
          ! grep -q 'fileNameString' "$game_library"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Fetch pinned Libretro header
        working-directory: MegaDriveTV
        run: |
          git clone --quiet https://github.com/libretro/libretro-common.git "$RUNNER_TEMP/libretro-common"
          git -C "$RUNNER_TEMP/libretro-common" checkout "$LIBRETRO_COMMON_COMMIT"
          mkdir -p app/src/main/cpp/include
          cp "$RUNNER_TEMP/libretro-common/include/libretro.h" app/src/main/cpp/include/libretro.h

      - name: Package official BlastEm Android cores
        working-directory: MegaDriveTV
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a licenses

          curl -fL --retry 3 --retry-delay 2 \
            "https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/blastem_libretro_android.so.zip" \
            -o "$RUNNER_TEMP/blastem-arm64.zip"
          curl -fL --retry 3 --retry-delay 2 \
            "https://buildbot.libretro.com/nightly/android/latest/armeabi-v7a/blastem_libretro_android.so.zip" \
            -o "$RUNNER_TEMP/blastem-armv7.zip"

          extract_core() {
            local archive="$1"
            local destination="$2"
            local entry
            entry="$(unzip -Z1 "$archive" | grep -E '(^|/)blastem_libretro_android\.so$' | head -n 1)"
            test -n "$entry"
            unzip -p "$archive" "$entry" > "$destination"
            test -s "$destination"
          }

          extract_core "$RUNNER_TEMP/blastem-arm64.zip" app/src/main/jniLibs/arm64-v8a/libblastem.so
          extract_core "$RUNNER_TEMP/blastem-armv7.zip" app/src/main/jniLibs/armeabi-v7a/libblastem.so

          readelf -h app/src/main/jniLibs/arm64-v8a/libblastem.so | grep -q 'Machine:.*AArch64'
          readelf -h app/src/main/jniLibs/armeabi-v7a/libblastem.so | grep -q 'Machine:.*ARM'

          curl -fL --retry 3 \
            "https://raw.githubusercontent.com/libretro/blastem/$BLASTEM_COMMIT/COPYING" \
            -o licenses/BLASTEM-COPYING.txt
          printf '%s\n' \
            "BlastEm source repository: https://github.com/libretro/blastem" \
            "Source commit: $BLASTEM_COMMIT" \
            "Android binaries: https://buildbot.libretro.com/nightly/android/latest/" \
            "The bundled core is the unmodified Libretro BlastEm core." \
            > licenses/BLASTEM-SOURCE.txt

          sha256sum app/src/main/jniLibs/arm64-v8a/libblastem.so app/src/main/jniLibs/armeabi-v7a/libblastem.so

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'
          cache-provider: basic

      - name: Build debug APK
        working-directory: MegaDriveTV
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: MegaDriveTV-debug-APK
          path: MegaDriveTV/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        if: success()
        run: |
          echo "## Mega Drive TV APK" >> "$GITHUB_STEP_SUMMARY"
          echo "Build concluído para armeabi-v7a e arm64-v8a." >> "$GITHUB_STEP_SUMMARY"
          echo "Baixe o artefato **MegaDriveTV-debug-APK** na aba Actions." >> "$GITHUB_STEP_SUMMARY"
