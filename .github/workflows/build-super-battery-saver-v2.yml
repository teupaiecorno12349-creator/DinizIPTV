name: Build Super Battery Saver V2 APK

on:
  push:
    branches: ["agent/super-battery-saver-v2"]
    paths:
      - "battery-tool/batterysaver/**"
      - "battery-tool/settings.gradle"
      - "battery-tool/build.gradle"
      - ".github/workflows/build-super-battery-saver-v2.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: battery-tool
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        run: gradle --no-daemon :batterysaver:assembleDebug
      - name: Prepare artifact
        run: |
          mkdir -p ../apks
          cp batterysaver/build/outputs/apk/debug/batterysaver-debug.apk ../apks/Super-Economia-Bateria-V2.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Super-Economia-Bateria-V2-APK
          path: apks/Super-Economia-Bateria-V2.apk
