name: Build Sonic X360 XEX

on:
  push:
    branches:
      - sonic-x360-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-xex:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex texinfo libgmp-dev libmpfr-dev libmpc-dev curl xz-utils patch python3 cmake ninja-build git

      - name: Checkout Xbox 360 SDK
        run: |
          git clone --depth 1 https://github.com/xenosworks/xsdk.git "$RUNNER_TEMP/xsdk"

      - name: Build PowerPC Xbox 360 toolchain
        run: |
          PREFIX="$RUNNER_TEMP/xsdk-gcc" \
          WORK="$RUNNER_TEMP/xsdk-gcc-work" \
          JOBS="$(nproc)" \
            "$RUNNER_TEMP/xsdk/tools/toolchain/build.sh"

      - name: Build xsdk libraries and XEX tools
        run: |
          make -C "$RUNNER_TEMP/xsdk" -j"$(nproc)" \
            TOOLCHAIN="$RUNNER_TEMP/xsdk-gcc/bin/powerpc-xsdk-elf-"

      - name: Configure Sonic X360 project
        run: |
          cmake -S Sonic_Xbox360_Port_Lab -B Sonic_Xbox360_Port_Lab/build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$RUNNER_TEMP/xsdk/cmake/xsdk.cmake" \
            -DXSDK_TOOLCHAIN="$RUNNER_TEMP/xsdk-gcc" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Compile native Xbox 360 XEX
        run: |
          cmake --build Sonic_Xbox360_Port_Lab/build --verbose
          test -s Sonic_Xbox360_Port_Lab/build/sonic_x360.xex
          file Sonic_Xbox360_Port_Lab/build/sonic_x360.xex || true

      - name: Upload XEX artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-X360-Port-Lab-XEX
          path: Sonic_Xbox360_Port_Lab/build/sonic_x360.xex
          if-no-files-found: error
          retention-days: 30
