name: Build LK Play Local Panel APK

on:
  push:
    branches: [ lkplay-manager-build ]
    paths:
      - 'lkplay-manager/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lkplay-manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare artifact
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/LK-Play-Painel-Local.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LK-Play-Painel-Local
          path: lkplay-manager/output/LK-Play-Painel-Local.apk
          if-no-files-found: error
