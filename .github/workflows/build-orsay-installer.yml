name: Build Samsung Orsay Installer

on:
  push:
    branches:
      - samsung-orsay-installer
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Orsay APK
        run: gradle --no-daemon :orsay-installer:assembleDebug

      - name: Rename APK
        run: |
          mkdir -p apks
          cp orsay-installer/build/outputs/apk/debug/orsay-installer-debug.apk apks/Samsung-Orsay-Widget-Installer-v1.0.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Samsung-Orsay-Widget-Installer
          path: apks/Samsung-Orsay-Widget-Installer-v1.0.0.apk
          if-no-files-found: error
