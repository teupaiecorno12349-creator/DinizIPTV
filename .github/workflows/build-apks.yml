name: Build Android APKs

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APKs
        run: gradle --no-daemon :admin:assembleDebug :player:assembleDebug

      - name: Collect APKs
        run: |
          mkdir -p apks
          cp admin/build/outputs/apk/debug/admin-debug.apk apks/Diniz-IPTV-Admin.apk
          cp player/build/outputs/apk/debug/player-debug.apk apks/Diniz-IPTV-Player.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Diniz-IPTV-APKs
          path: apks/*.apk
          if-no-files-found: error
