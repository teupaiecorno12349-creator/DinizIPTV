name: Build Diniz XCloud TV Native

on:
  workflow_dispatch:
  push:
    branches: [ xcloud-tv-native ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Diniz project
        uses: actions/checkout@v4

      - name: Checkout XStreaming source
        uses: actions/checkout@v4
        with:
          repository: Geocld/XStreaming
          ref: 06ef1c7ee01d09cf9bb2a97fc4895da85e8488a8
          path: upstream

      - name: Apply Diniz branding and TV defaults
        run: |
          git -C upstream apply ../xcloud-native/diniz.patch
          mkdir -p upstream/android/app/src/main/assets
          cp upstream/LICENSE upstream/android/app/src/main/assets/AGPL-3.0.txt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 34 and NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;23.1.7779620"

      - name: Set up Rust for 32-bit ARM
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" target add armv7-linux-androideabi

      - name: Install Yarn 4
        working-directory: upstream
        run: |
          corepack enable
          corepack prepare yarn@4.2.2 --activate
          yarn --version

      - name: Install JavaScript dependencies
        working-directory: upstream
        run: yarn install --immutable

      - name: Build Diniz XCloud APK (32-bit ARM, 720p, native renderer)
        working-directory: upstream/android
        run: |
          ./gradlew --no-daemon --stacktrace -PreactNativeArchitectures=armeabi-v7a :app:assembleProdRelease

      - name: Collect APK
        run: |
          mkdir -p apks
          cp upstream/android/app/build/outputs/apk/prod/release/app-prod-release.apk apks/Diniz-XCloud-TV.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Diniz-XCloud-TV-Native
          path: apks/Diniz-XCloud-TV.apk
          if-no-files-found: error
