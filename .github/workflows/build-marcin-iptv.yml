name: Build Marcin IPTV for Android TV

on:
  push:
    branches: ["build/marcin-iptv-android-tv"]
    paths:
      - "player/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - ".github/workflows/build-marcin-iptv.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marcin-iptv-tvbox-build
  cancel-in-progress: true

jobs:
  build-player-apk:
    name: Compile Marcin IPTV TV Box APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout isolated app branch
        uses: actions/checkout@v4
        with:
          ref: build/marcin-iptv-android-tv

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses and install compile platform
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compile debug APK
        run: gradle --no-daemon --stacktrace :player:assembleDebug

      - name: Verify APK and package source bundle
        shell: bash
        run: |
          set -euo pipefail
          APK="player/build/outputs/apk/debug/player-debug.apk"
          test -s "$APK"
          mkdir -p apks
          cp "$APK" apks/Marcin-IPTV-TVBox.apk
          sha256sum apks/Marcin-IPTV-TVBox.apk > apks/SHA256SUMS.txt
          cp player/src/main/java/com/diniz/iptv/player/*.java apks/
          cp player/src/main/AndroidManifest.xml apks/
          echo "APK_SIZE=$(stat -c '%s' apks/Marcin-IPTV-TVBox.apk)"
          echo "APK_SHA256=$(sha256sum apks/Marcin-IPTV-TVBox.apk | cut -d' ' -f1)"
          if command -v aapt >/dev/null 2>&1; then
            aapt dump badging apks/Marcin-IPTV-TVBox.apk | head -n 12
          fi

      - name: Upload Marcin IPTV APK
        uses: actions/upload-artifact@v4
        with:
          name: Marcin-IPTV-TVBox-APK
          path: apks/*
          if-no-files-found: error
          retention-days: 14
