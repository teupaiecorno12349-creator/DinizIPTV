name: Build MG Play Android TV

on:
  push:
    branches: [ mgplay-build ]
    paths:
      - 'MG-Play-source.part*'
      - '.github/workflows/build-mgplay.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Expand MG Play source archive
        run: |
          if compgen -G 'MG-Play-source.part*' > /dev/null; then
            cat MG-Play-source.part* | base64 --decode > MG-Play-source.zip
            unzip -oq MG-Play-source.zip -d .
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git rm -f MG-Play-source.part*
            git add mgplay MG-Play-source.zip
            if ! git diff --cached --quiet; then
              git commit -m 'Add MG Play Android TV source'
              git push
            fi
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build MG Play APK
        run: gradle -p mgplay --no-daemon clean :app:assembleDebug

      - name: Package APK and HTML panel
        run: |
          mkdir -p mgplay/output/panel
          cp mgplay/app/build/outputs/apk/debug/app-debug.apk mgplay/output/MG-Play.apk
          cp mgplay/site/index.html mgplay/output/panel/index.html
          (cd mgplay/output/panel && zip -q -r ../MG-Play-Panel.zip .)
          unzip -t mgplay/output/MG-Play.apk
          test -s mgplay/output/MG-Play.apk

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MG-Play-Android-TV
          path: |
            mgplay/output/MG-Play.apk
            mgplay/output/MG-Play-Panel.zip
          if-no-files-found: error
          retention-days: 30
