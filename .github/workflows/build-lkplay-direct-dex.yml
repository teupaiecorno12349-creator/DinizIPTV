name: Build LK Play Direct Launcher DEX

on:
  push:
    branches: [ lkplay-manager-build ]
    paths:
      - 'lkplay-direct/**'
      - '.github/workflows/build-lkplay-direct-dex.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lkplay-direct
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile launcher and provider playlist manager
        run: gradle --no-daemon :app:assembleDebug
      - name: Extract all DEX payloads
        run: |
          mkdir -p output
          python3 - <<'PY'
          import os, re, zipfile
          apk = "app/build/outputs/apk/debug/app-debug.apk"
          out = "output"
          with zipfile.ZipFile(apk) as z:
              names = [n for n in z.namelist() if re.fullmatch(r"classes(?:[0-9]+)?[.]dex", n)]
              if not names:
                  raise SystemExit("No classes*.dex entries found in helper APK")
              for name in names:
                  with open(os.path.join(out, name), "wb") as f:
                      f.write(z.read(name))
              print("Extracted DEX files:", ", ".join(names))
          PY
          cp app/build/outputs/apk/debug/app-debug.apk output/helper-debug.apk
          cp app/src/main/java/com/lbpro/stream/LocalPlaylistActivity.java output/LocalPlaylistActivity.java
          python3 - <<'PY'
          import glob
          paths=glob.glob("output/classes*.dex")
          if not paths: raise SystemExit("No DEX payloads were exported")
          data=b"".join(open(p,"rb").read() for p in paths)
          if b"com/lbpro/stream/LocalPlaylistActivity" not in data:
              raise SystemExit("LocalPlaylistActivity class descriptor not found")
          if b"Lcom/lbpro/stream/R;" in data:
              raise SystemExit("Duplicate original R class detected; check Gradle namespace")
          print("Verified", len(paths), "DEX file(s) and LocalPlaylistActivity descriptor")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: LK-Play-Direct-DEX
          path: lkplay-direct/output/*
          if-no-files-found: error
