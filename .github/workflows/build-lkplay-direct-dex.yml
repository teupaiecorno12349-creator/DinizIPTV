name: Build LK Play Direct Launcher DEX

on:
  push:
    branches: [ lkplay-manager-build ]
    paths:
      - 'lkplay-direct/**'
      - '.github/workflows/build-lkplay-direct-dex.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lkplay-direct
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile launcher and provider playlist manager
        run: gradle --no-daemon :app:assembleDebug
      - name: Extract all DEX payloads
        run: |
          mkdir -p output
          unzip -l app/build/outputs/apk/debug/app-debug.apk | awk '/classes[0-9]*\\.dex$/ {print $4}' > output/dex-list.txt
          while read f; do
            [ -n "$f" ] || continue
            cp "app/build/outputs/apk/debug/$f" "output/$f"
          done < output/dex-list.txt
          cp app/build/outputs/apk/debug/app-debug.apk output/helper-debug.apk
          cp app/src/main/java/com/lbpro/stream/LocalPlaylistActivity.java output/LocalPlaylistActivity.java
          grep -a -q 'LocalPlaylistActivity' output/*.dex
      - uses: actions/upload-artifact@v4
        with:
          name: LK-Play-Direct-DEX
          path: lkplay-direct/output/*
          if-no-files-found: error
