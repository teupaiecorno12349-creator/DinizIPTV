name: Build LK Play Direct Launcher DEX

on:
  push:
    branches: [ lkplay-manager-build ]
    paths:
      - 'lkplay-direct/**'
      - '.github/workflows/build-lkplay-direct-dex.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lkplay-direct
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile launcher and provider playlist manager
        run: gradle --no-daemon :app:assembleDebug
      - name: Extract DEX payload
        run: |
          mkdir -p output
          unzip -p app/build/outputs/apk/debug/app-debug.apk classes.dex > output/classes5.dex
          test -s output/classes5.dex
          cp app/src/main/java/com/lbpro/stream/LocalPlaylistActivity.java output/LocalPlaylistActivity.java
      - uses: actions/upload-artifact@v4
        with:
          name: LK-Play-Direct-DEX
          path: lkplay-direct/output/*
          if-no-files-found: error
