name: Build Classic Disaster Survival for Xbox 360
on:
  push:
    branches: ["build/classic-disaster-360"]
    paths:
      - "ClassicDisaster360/**"
      - ".github/workflows/classic-disaster-360.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-xex:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout project branch
        uses: actions/checkout@v4
      - name: Install XSDK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex texinfo libgmp-dev libmpfr-dev libmpc-dev curl xz-utils patch python3 cmake ninja-build git
      - name: Restore toolchain cache
        uses: actions/cache@v4
        with:
          path: |
            ~/xsdk-gcc
            ~/xsdk-gcc-work
            ~/xsdk
            ~/glslang-xenon
          key: xsdk-xenon-toolchain-2026-10-v2
      - name: Fetch XSDK
        run: |
          if [ ! -f "$HOME/xsdk/cmake/xsdk.cmake" ]; then
            git clone --depth 1 https://github.com/xenosworks/xsdk.git "$HOME/xsdk"
          fi
      - name: Build PowerPC Xbox 360 toolchain
        run: |
          PREFIX="$HOME/xsdk-gcc" WORK="$HOME/xsdk-gcc-work" JOBS=2 "$HOME/xsdk/tools/toolchain/build.sh"
      - name: Build HLSL/GLSL shader compiler
        run: |
          if [ ! -f "$HOME/glslang-xenon/CMakeLists.txt" ]; then
            git clone --depth 1 --branch xenon https://github.com/xenosworks/glslang-xenon.git "$HOME/glslang-xenon"
          fi
          cd "$HOME/glslang-xenon"
          python3 update_glslang_sources.py
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DENABLE_OPT=ON -DSPIRV_SKIP_EXECUTABLES=ON -DGLSLANG_TESTS=OFF
          cmake --build build --parallel 2
          cp build/StandAlone/glslang "$HOME/xsdk-gcc/bin/glslang"
      - name: Build XSDK libraries and tools
        run: |
          export PATH="$HOME/xsdk-gcc/bin:$PATH"
          cd "$HOME/xsdk"
          make -j2 TOOLCHAIN="$HOME/xsdk-gcc/bin/powerpc-xsdk-elf-"
      - name: Compile the Xbox 360 title
        run: |
          cmake -S ClassicDisaster360 -B build-classic-disaster -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$HOME/xsdk/cmake/xsdk.cmake" \
            -DXSDK_TOOLCHAIN="$HOME/xsdk-gcc"
          cmake --build build-classic-disaster --verbose
          test -s build-classic-disaster/classic_disaster.xex
          mkdir -p dist
          cp build-classic-disaster/classic_disaster.xex dist/ClassicDisaster360.xex
      - name: Upload XEX artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClassicDisaster360-XEX
          path: dist/ClassicDisaster360.xex
          if-no-files-found: error
          retention-days: 14
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ClassicDisaster360-build-logs
          path: |
            build-classic-disaster
            ~/xsdk-gcc-work/logs
          if-no-files-found: ignore
          retention-days: 7
