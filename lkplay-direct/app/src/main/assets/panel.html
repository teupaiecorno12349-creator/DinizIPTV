<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LK Play • Painel</title><style>
*{box-sizing:border-box}body{margin:0;background:#0d1421;color:#f2f6fc;font:15px system-ui;padding:22px}.wrap{max-width:850px;margin:auto}.brand{font-size:28px;font-weight:900;color:#fff;margin-bottom:4px}.brand span{color:#39c5b4}.muted{color:#9aabc1}.card{background:#172338;border:1px solid #30435e;border-radius:15px;padding:20px;margin:15px 0}h2{margin:0 0 8px}label{display:block;margin:13px 0 5px;color:#aebed2;font-size:12px;font-weight:800}input,select{width:100%;padding:13px;border:1px solid #3b506e;border-radius:9px;background:#0c1728;color:white;font:inherit}.btn{padding:12px 16px;border:0;border-radius:9px;background:#39c5b4;color:#09201e;font-weight:900;cursor:pointer;margin:12px 7px 0 0}.secondary{background:#2a405d;color:#e9f1fc}.danger{background:#4b2632;color:#ffc4ce}.hide{display:none}.row{display:flex;gap:10px}.row>*{flex:1}.item{padding:13px;border:1px solid #30435e;border-radius:10px;margin:10px 0;background:#101b2d}.tag{float:right;color:#87e8da;font-size:11px;font-weight:900}.msg{padding:9px;background:#173c36;color:#a3f0d6;border-radius:8px;margin-top:10px}.err{background:#48242e;color:#ffc1ca}@media(max-width:560px){body{padding:12px}.row{display:block}.card{padding:15px}}</style></head><body><main class="wrap"><div class="brand">LK <span>PLAY</span></div><div class="muted">PAINEL LOCAL DE GERENCIAMENTO</div>
<section class="card" id="login"><h2>Entrar</h2><p class="muted">Use o ID do dispositivo e a chave mostrados na tela do LK Play.</p><label>ID DO DISPOSITIVO</label><input id="mac" placeholder="ID exibido no LK Play"><label>CHAVE</label><input id="key" type="password"><button class="btn" id="enter">ENTRAR</button><div id="loginMsg"></div></section>
<section class="card hide" id="manager"><div class="row"><div><h2>Minhas listas</h2><div class="muted" id="device"></div></div><button class="btn secondary" id="exit">SAIR</button></div><button class="btn" id="add">+ ADICIONAR LISTA</button><button class="btn secondary" id="refresh">ATUALIZAR</button><div id="items"></div></section>
<section class="card hide" id="form"><h2 id="formTitle">Nova lista</h2><label>TIPO</label><select id="type"><option value="m3u">M3U / M3U8</option><option value="xtream">XTREAM CODES</option></select><label>NOME</label><input id="name" placeholder="Minha lista"><div id="m3u"><label>URL M3U</label><input id="m3uUrl" placeholder="https://.../lista.m3u"></div><div id="xtream" class="hide"><label>SERVIDOR</label><input id="server"><div class="row"><div><label>USUÁRIO</label><input id="user"></div><div><label>SENHA</label><input id="pass" type="password"></div></div></div><button class="btn" id="save">SALVAR</button><button class="btn secondary" id="cancel">CANCELAR</button><div id="formMsg"></div></section></main>
<script>
(()=>{const $=x=>document.getElementById(x);let token=sessionStorage.t||'',edit=null;function notice(id,s,bad=false){$(id).textContent=s;$(id).className=s?(bad?'msg err':'msg'):''}async function api(path,method='GET',body){let h={'Accept':'application/json'};if(token)h.Authorization='Bearer '+token;if(body)h['Content-Type']='application/json';let r=await fetch(path,{method,headers:h,body:body?JSON.stringify(body):undefined});let j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'Falha');return j}async function login(){try{notice('loginMsg','');let j=await api('/api/panel/login','POST',{mac:$('mac').value,deviceKey:$('key').value});token=j.access_token;sessionStorage.t=token;sessionStorage.d=JSON.stringify(j.device);$('login').classList.add('hide');$('manager').classList.remove('hide');$('device').textContent=j.device.mac;load()}catch(e){notice('loginMsg',e.message,true)}}async function load(){try{let j=await api('/api/panel/playlists');$('items').innerHTML='';if(!j.playlists.length)$('items').textContent='Nenhuma lista cadastrada.';j.playlists.forEach(p=>{let d=document.createElement('div');d.className='item';let info=p.type==='m3u'?p.m3u_url:p.server_url+' • '+p.username;d.innerHTML='<span class="tag">'+p.type.toUpperCase()+'</span><b></b><p class="muted"></p><button class="btn secondary e">EDITAR</button><button class="btn danger d">EXCLUIR</button>';d.querySelector('b').textContent=p.name;d.querySelector('p').textContent=info||'';d.querySelector('.e').onclick=()=>open(p);d.querySelector('.d').onclick=()=>remove(p);$('items').append(d)})}catch(e){notice('formMsg',e.message,true)}}function type(){let t=$('type').value;$('m3u').classList.toggle('hide',t!=='m3u');$('xtream').classList.toggle('hide',t!=='xtream')}function open(p){edit=p?.id||null;$('formTitle').textContent=p?'Editar lista':'Nova lista';$('type').value=p?.type||'m3u';$('name').value=p?.name||'';$('m3uUrl').value=p?.m3u_url||'';$('server').value=p?.server_url||'';$('user').value=p?.username||'';$('pass').value=p?.password||'';type();$('form').classList.remove('hide')}async function save(){let t=$('type').value,b={type:t,name:$('name').value};if(t==='m3u')b.m3u_url=$('m3uUrl').value;else{b.server_url=$('server').value;b.username=$('user').value;b.password=$('pass').value}try{await api(edit?'/api/panel/playlists/'+edit:'/api/panel/playlists',edit?'PATCH':'POST',b);$('form').classList.add('hide');notice('formMsg','Lista salva.');load()}catch(e){notice('formMsg',e.message,true)}}async function remove(p){if(!confirm('Excluir '+p.name+'?'))return;try{await api('/api/panel/playlists/'+p.id,'DELETE');load()}catch(e){alert(e.message)}}function logout(){token='';sessionStorage.removeItem('t');$('manager').classList.add('hide');$('form').classList.add('hide');$('login').classList.remove('hide')}$('enter').onclick=login;$('key').onkeydown=e=>{if(e.key==='Enter')login()};$('add').onclick=()=>open();$('refresh').onclick=load;$('exit').onclick=logout;$('type').onchange=type;$('save').onclick=save;$('cancel').onclick=()=>$('form').classList.add('hide');if(token){$('login').classList.add('hide');$('manager').classList.remove('hide');try{$('device').textContent=JSON.parse(sessionStorage.d||'{}').mac||''}catch(e){}load()}})();
</script></body></html>
